<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorate="~{game/basic}">
<head>
<meta charset="UTF-8">
<title layout:fragment="title">로그인</title>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

<th:block layout:fragment="script">
	<link rel="stylesheet" href="/css/game.css">
	<script src="/js/game.js"></script>
	<th:block th:if="${fail}" th:utext="${fail}">
		<script th:inline="javascript">
			alert("아이디 또는 비밀번호가 잘못되었습니다");
		</script>
	</th:block>
</th:block>
</head>
<body>
<div id="wrap">
		<div id="header">
			<div id="nav">
				<ul id="menuList">				
				</ul>
				<div id="userALogo">
					<div class="userbox">
						<span class="loginLink">
							<a th:href="@{/game/login}">로그인</a>
						</span>
						<span class="userService">고객센터</span>
					</div>
				</div>
			</div>
		</div>
		<div  layout:fragment="main" id="main">
			<form method="post" th:action="@{/game/signIn}" th:object="${member}">
				<div id="formData">
					<div class="inputField">
						<input type="text" th:field="*{email}">
						<label th:for="email">아이디</label>
					</div>
					<div class="inputField">
						<input type="password" th:field="*{password}">
						<label th:for="password">비밀번호</label>
					</div>
					<div class="loginBt">
						
						<button>LOGIN</button>
					</div>
				</div>
			</form>
			<div id="forget_new">
				<a href="">아이디/비밀번호찾기</a>
				<a href="/game/signUp">회원가입</a>
			</div>
		</div>
		</div>
		<div id="footer">
		
		</div>
	</div>
</body>
</html>
